<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}voidscout{% endblock %}</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/voidscout.css') }}" rel="stylesheet">
</head>
<body>
	<header class="void-header">
		<nav class="navbar navbar-expand-lg void-navbar" aria-label="Main navigation">
			<div class="container-fluid px-3 px-lg-4">
				<a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
					<img src="{{ url_for('static', filename='img/void-logo.svg') }}" alt="" class="void-brand-logo" aria-hidden="true">
					<span>voidscout</span>
				</a>

				<div class="d-flex align-items-center gap-2 ms-auto">
					<a class="btn btn-void-icon"
						href="https://voidlinux.org/download/"
						target="_blank"
						rel="noopener noreferrer"
						title="Download Void Linux"
						aria-label="Download Void Linux">
						<i class="bi bi-download" aria-hidden="true"></i>
					</a>
					<a class="btn btn-void-icon"
						href="https://github.com/dmdutra/voidscout"
						target="_blank"
						rel="noopener noreferrer"
						title="voidscout on GitHub"
						aria-label="voidscout on GitHub">
						<i class="bi bi-github" aria-hidden="true"></i>
					</a>
				</div>
			</div>
		</nav>
	</header>

	<main class="container-fluid px-3 px-lg-4 py-4 py-lg-5">
		{% block content %}{% endblock %}
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
	{% block scripts %}{% endblock %}
</body>
</html>
